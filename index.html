<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CosmiCLabIndicators</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="bg"></div>

  <header class="topbar">
    <div class="container topbarInner">
      <a class="brand" href="index.html">
        <img class="brandLogo" src="assets/cosmiclab_logo.png" />
        <div class="brandName">CosmiCLabIndicators</div>
      </a>

      <nav class="nav">
        <a class="navLink" href="#services" data-i18n="nav.services">Услуги</a>
        <a class="navLink" href="#tiles" data-i18n="nav.tiles">Выкладки</a>
        <a class="navLink" href="#inside" data-i18n="nav.inside">Что внутри</a>
        <a class="navLink" href="#contact" data-i18n="nav.contact">Контакт</a>
      </nav>

      <div class="topbarRight">
        <div class="lang">
          <button class="langBtn" data-lang="ru">RU</button>
          <button class="langBtn" data-lang="en">EN</button>
          <button class="langBtn" data-lang="de">DE</button>
        </div>

        <a class="btn pill" target="_blank"
           href="https://t.me/KirilsSZ" data-i18n="cta.telegramTop">Telegram</a>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- HERO -->
    <section class="hero">
      <div>
        <h1 class="heroTitle" data-i18n="hero.title"></h1>
        <p class="heroSub" data-i18n="hero.sub"></p>

        <div class="heroCtas">
          <a class="btn primary" target="_blank"
             href="https://t.me/KirilsSZ" data-i18n="cta.telegram"></a>

          <a class="btn ghost" href="#services" data-i18n="cta.services"></a>
        </div>
      </div>

      <div class="heroImageWrap">
        <img class="heroImage" src="assets/hero_chart.png" />
      </div>
    </section>

    <!-- TILES -->
    <section id="tiles" class="section">
      <h2 data-i18n="sections.tiles"></h2>

      <div class="tiles">

        <a class="tile" href="tradingview.html">
          <div class="tileTitle" data-i18n="tiles.tv.title"></div>
          <div class="tileSub" data-i18n="tiles.tv.sub"></div>
        </a>

        <a class="tile" href="mt5.html">
          <div class="tileTitle" data-i18n="tiles.mt5.title"></div>
          <div class="tileSub" data-i18n="tiles.mt5.sub"></div>
        </a>

        <a class="tile" href="bots.html">
          <div class="tileTitle" data-i18n="tiles.bots.title"></div>
          <div class="tileSub" data-i18n="tiles.bots.sub"></div>
        </a>

        <!-- VPN -->
        <a class="tile" href="privacy.html">
          <div class="tileTitle" data-i18n="tiles.vpn.title"></div>
          <div class="tileSub" data-i18n="tiles.vpn.sub"></div>
        </a>

      </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="section contact">
      <h2 data-i18n="sections.contact"></h2>

      <a class="btn primary" target="_blank"
         href="https://t.me/KirilsSZ" data-i18n="contact.btn"></a>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
